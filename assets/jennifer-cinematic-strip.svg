<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Project Jennifer cinematic memory strip</title>
  <desc id="desc">Animated five-stage sequence showing choice, companion, receipt, consequence and persistent world memory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A0B12"/><stop offset=".55" stop-color="#171126"/><stop offset="1" stop-color="#071612"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9B7BFF"/><stop offset=".55" stop-color="#58D6FF"/><stop offset="1" stop-color="#52E2B3"/></linearGradient>
    <style>
      .t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.w{fill:#F6F4FB}.muted{fill:#AAA7B5}.v{fill:#B59BFF}.g{fill:#62E5B9}.c{fill:#69D8FF}.gold{fill:#FFCE32}
      .frame{fill:#0F111A;stroke:#8D7AF4;stroke-opacity:.24}.step{opacity:.42;animation:step 7.5s ease-in-out infinite}.s2{animation-delay:1.25s}.s3{animation-delay:2.5s}.s4{animation-delay:3.75s}.s5{animation-delay:5s}.rail{stroke-dasharray:10 14;animation:rail 8s linear infinite}
      @keyframes step{0%,100%{opacity:.42;transform:translateY(0)}15%,35%{opacity:1;transform:translateY(-6px)}}@keyframes rail{to{stroke-dashoffset:-240}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.step{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <text x="58" y="58" class="t w" font-size="30" font-weight="800">PROJECT JENNIFER // THE WORLD REMEMBERS WHAT YOU CHOOSE</text>
  <text x="58" y="86" class="m muted" font-size="13">A governed consequence loop, rendered as story.</text>
  <path d="M120 212H1080" stroke="url(#beam)" stroke-width="3" stroke-opacity=".4" class="rail"/>

  <g class="step">
    <rect x="58" y="126" width="190" height="160" rx="20" class="frame"/>
    <circle cx="153" cy="176" r="28" fill="#9B7BFF" opacity=".14"/><path d="M140 176l9 9 18-21" fill="none" stroke="#B59BFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="153" y="230" text-anchor="middle" class="t w" font-size="19" font-weight="750">CHOICE</text>
    <text x="153" y="254" text-anchor="middle" class="m muted" font-size="11">YOU ACT</text>
  </g>

  <g class="step s2">
    <rect x="282" y="126" width="190" height="160" rx="20" class="frame"/>
    <circle cx="377" cy="176" r="28" fill="#FF87C8" opacity=".13"/><circle cx="369" cy="174" r="8" fill="#FF87C8"/><circle cx="387" cy="174" r="8" fill="#FF87C8"/><path d="M360 192c11 9 24 9 35 0" fill="none" stroke="#FF87C8" stroke-width="3" stroke-linecap="round"/>
    <text x="377" y="230" text-anchor="middle" class="t w" font-size="19" font-weight="750">COMPANION</text>
    <text x="377" y="254" text-anchor="middle" class="m muted" font-size="11">THEY REMEMBER</text>
  </g>

  <g class="step s3">
    <rect x="506" y="126" width="190" height="160" rx="20" class="frame"/>
    <rect x="573" y="148" width="56" height="56" rx="10" fill="#58D6FF" opacity=".14"/><path d="M585 162h32M585 175h24M585 188h28" stroke="#69D8FF" stroke-width="3" stroke-linecap="round"/>
    <text x="601" y="230" text-anchor="middle" class="t w" font-size="19" font-weight="750">RECEIPT</text>
    <text x="601" y="254" text-anchor="middle" class="m muted" font-size="11">WHY IT CHANGED</text>
  </g>

  <g class="step s4">
    <rect x="730" y="126" width="190" height="160" rx="20" class="frame"/>
    <circle cx="825" cy="176" r="28" fill="#FFCE32" opacity=".13"/><path d="M806 183l15-15 10 10 14-17" fill="none" stroke="#FFCE32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="825" y="230" text-anchor="middle" class="t w" font-size="19" font-weight="750">CONSEQUENCE</text>
    <text x="825" y="254" text-anchor="middle" class="m muted" font-size="11">WORLD STATE MOVES</text>
  </g>

  <g class="step s5">
    <rect x="954" y="126" width="190" height="160" rx="20" class="frame"/>
    <circle cx="1049" cy="176" r="28" fill="#52E2B3" opacity=".13"/><path d="M1033 177c9-18 22-18 32 0-10 18-23 18-32 0z" fill="none" stroke="#62E5B9" stroke-width="4"/><circle cx="1049" cy="177" r="5" class="g"/>
    <text x="1049" y="230" text-anchor="middle" class="t w" font-size="19" font-weight="750">PERSISTENCE</text>
    <text x="1049" y="254" text-anchor="middle" class="m muted" font-size="11">LATER STILL MATTERS</text>
  </g>

  <text x="600" y="326" text-anchor="middle" class="m v" font-size="14">CHOICE → COMPANION → RECEIPT → CONSEQUENCE → RETURN LATER → SAME TRUTH</text>
</svg>