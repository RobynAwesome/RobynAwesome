<svg width="1200" height="230" viewBox="0 0 1200 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Kopano ecosystem flow</title>
  <desc id="desc">Animated network linking Kopano Context to Project Jennifer, KasiLink, Five's Arena, Cars4Mars and AMAPHU.</desc>
  <defs>
    <linearGradient id="edge" x1="150" y1="115" x2="1050" y2="115" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFCE32"/><stop offset="0.5" stop-color="#4CE6B3"/><stop offset="1" stop-color="#9B7BFF"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="230" rx="24" fill="#0B1110"/>
  <g stroke="#24302C" stroke-width="1.5" fill="none">
    <path d="M600 115L170 55"/><path d="M600 115L170 175"/><path d="M600 115L1030 55"/><path d="M600 115L1030 175"/><path d="M600 115L385 185"/><path d="M600 115L815 185"/>
  </g>
  <g fill="#111B17" stroke="#314039">
    <rect x="495" y="79" width="210" height="72" rx="18"/><rect x="88" y="28" width="165" height="54" rx="15"/><rect x="88" y="148" width="165" height="54" rx="15"/>
    <rect x="947" y="28" width="165" height="54" rx="15"/><rect x="947" y="148" width="165" height="54" rx="15"/><rect x="305" y="158" width="160" height="50" rx="15"/><rect x="735" y="158" width="160" height="50" rx="15"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="108" fill="#F5F7F6" font-size="18" font-weight="800">KOPANO CONTEXT</text><text x="600" y="132" fill="#9AB0A6" font-size="12">KPGS · GOVERNANCE · ORCHESTRATION</text>
    <text x="170" y="61" fill="#FFCE32" font-size="14" font-weight="700">KasiLink</text><text x="170" y="181" fill="#4CE6B3" font-size="14" font-weight="700">Five's Arena</text>
    <text x="1030" y="61" fill="#B8A7FF" font-size="14" font-weight="700">Project Jennifer</text><text x="1030" y="181" fill="#FF8D7A" font-size="14" font-weight="700">Cars4Mars</text>
    <text x="385" y="188" fill="#D7C46A" font-size="14" font-weight="700">AMAPHU</text><text x="815" y="188" fill="#7FD7FF" font-size="14" font-weight="700">PKA</text>
  </g>
  <circle r="5" fill="#FFCE32" filter="url(#soft)"><animateMotion dur="5.8s" repeatCount="indefinite" path="M600 115L170 55L600 115L1030 55L600 115L1030 175L600 115L170 175L600 115"/></circle>
  <circle r="4" fill="#4CE6B3" filter="url(#soft)"><animateMotion dur="7.4s" begin="-2s" repeatCount="indefinite" path="M600 115L385 185L600 115L815 185L600 115L1030 55L600 115"/></circle>
  <circle cx="600" cy="115" r="8" fill="#4CE6B3" opacity="0.85"><animate attributeName="r" values="7;13;7" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.95;0.35;0.95" dur="2.4s" repeatCount="indefinite"/></circle>
  <rect x="20" y="20" width="1160" height="190" rx="18" fill="none" stroke="url(#edge)" stroke-opacity="0.28"/>
</svg>
